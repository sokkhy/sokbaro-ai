<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SokBaro AI</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        width: 280px;
        background: #0a0a0a;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 20px;
      }
      h1 { font-size: 16px; margin: 0 0 2px; }
      .tagline { font-size: 12px; color: #737373; margin: 0 0 16px; }
      .score { font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
      .score .max { font-size: 18px; color: #525252; }
      .status { font-size: 13px; font-weight: 600; margin-top: 6px; }
      .status.good { color: #10b981; }
      .status.bad { color: #ef4444; }
      .status.info { color: #0ea5e9; }
      .status.idle { color: #737373; }
      button {
        width: 100%;
        margin-top: 18px;
        padding: 10px;
        border: 0;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .start { background: #10b981; color: #000; }
      .stop { background: #262626; color: #fff; }
      .note { font-size: 11px; color: #525252; margin-top: 14px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h1>SokBaro AI</h1>
    <p class="tagline">Sit better. Work better.</p>

    <div class="score"><span id="score">—</span><span class="max"> / 100</span></div>
    <div id="status" class="status idle">Not monitoring</div>

    <button id="toggle" class="start">Start monitoring</button>

    <p class="note">
      Posture is checked in the background while this stays enabled. Alerts appear
      as a banner on the web page you're viewing. Your camera light stays on while
      monitoring; video never leaves your device.
    </p>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
